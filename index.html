<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cellipse cx=%2232%22 cy=%2232%22 rx=%2229%22 ry=%2218%22 transform=%22rotate(-35 32 32)%22 fill=%22%231f6feb%22/%3E%3Cpath d=%22M22 42 42 22M27 31l6 6M31 27l6 6M35 23l6 6%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Air Raid Analytics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="College football slate: the Air Raid Analytics model's projected spreads, edges against the Vegas line, star ratings, opponent-adjusted player and unit rankings, and FBS power ratings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: a broadcast slate board. Masthead with the track record, a sticky tab-and-filter bar, day-banded games
   (the card's full table on wide screens, stacked game cards on narrow ones), and a ranked ratings board with a power bar. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --band: #e8ecf1; --ink: #121821; --muted: #566171; --faint: #66707e;
  --rule: #dbe0e6; --accent: #1f6feb; --accent-ink: #1456c4; --accent-soft: #e4edfc; --star-off: #cfd6df;
  --neg: #c4562c; --win: #1a7f37; --loss: #c62828; --ring: rgba(18, 24, 33, 0);
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f15; --surface: #121821; --band: #1a212b; --ink: #e5e9ef; --muted: #9ca6b4; --faint: #8a94a3;
    --rule: #26303b; --accent: #4c8dff; --accent-ink: #84b0ff; --accent-soft: #15233a; --star-off: #323c48;
    --neg: #e3824f; --win: #3fb950; --loss: #f47067; --ring: rgba(255, 255, 255, .16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f15; --surface: #121821; --band: #1a212b; --ink: #e5e9ef; --muted: #9ca6b4; --faint: #8a94a3;
  --rule: #26303b; --accent: #4c8dff; --accent-ink: #84b0ff; --accent-soft: #15233a; --star-off: #323c48;
  --neg: #e3824f; --win: #3fb950; --loss: #f47067; --ring: rgba(255, 255, 255, .16); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, .rec td, .rtg td, .grid-n { font-variant-numeric: tabular-nums; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* masthead */
.mast { background: var(--surface); border-bottom: 1px solid var(--rule); }
.mast .wrap { padding-block: 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 40px; align-items: end; }
.kicker { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.2vw, 46px); line-height: .98; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
.meta b { color: var(--ink); font-weight: 600; }
.gates { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); }
.gates li { display: inline-flex; align-items: center; gap: 6px; }
.records { display: flex; gap: 14px; flex-wrap: wrap; }
.rec { border-collapse: collapse; font-size: 13.5px; background: var(--bg); border-radius: 8px; overflow: hidden; position: relative; }   /* relative: the hidden caption stays inside its card (phones scroll the cards sideways) */
.rec caption { caption-side: top; text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px; }
.rec thead th.win { text-align: left; text-transform: none; letter-spacing: .01em; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink); white-space: normal; }
.rec th, .rec td { padding: 4px 10px; text-align: right; white-space: nowrap; }
.rec thead th { font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--rule); }
.rec tbody th { text-align: left; font-weight: 500; color: var(--muted); }
.rec tbody tr:first-child td { color: var(--ink); font-weight: 600; }
.rec .pct { color: var(--muted); margin-left: 6px; }
.rec tfoot td, .rec tfoot th { border-top: 1px solid var(--rule); color: var(--muted); font-weight: 400; }
.rec tfoot th { text-align: left; }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 10px; }
.tabs { display: inline-flex; background: var(--band); border-radius: 9px; padding: 3px; gap: 2px; }
.tab { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 7px; white-space: nowrap; background: transparent; border: 0; cursor: pointer; appearance: none; line-height: 1.4; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: 1 1 auto; min-width: 0; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: var(--bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: var(--bg); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.chip[aria-pressed="true"] .stars path.on { fill: #fff; }
.chip[aria-pressed="true"] .stars path.off { fill: rgba(255, 255, 255, .35); }
.chip .n { color: var(--faint); font-size: 13px; }
.chip[aria-pressed="true"] .n { color: rgba(255, 255, 255, .8); }
.search { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 5px 10px; width: 170px; max-width: 100%; }
select.search { width: auto; }
.count { color: var(--muted); font-size: 13.5px; margin-left: auto; }

/* slate */
main { padding-block: 16px 8px; }
.legend { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; max-width: 80ch; }
.legend b { color: var(--ink); font-weight: 600; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; scrollbar-width: thin; }
.tablebox.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
table.slate { border-collapse: collapse; width: 100%; font-size: 14px; }
.slate th, .slate td { padding: 5px 5px; white-space: nowrap; }
.slate thead th { font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: center; border-bottom: 1px solid var(--rule); background: var(--surface); }
.slate thead tr.grp th { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; color: var(--faint); border-bottom: 0; padding-bottom: 0; }
.slate thead tr.grp th.g { border-bottom: 2px solid var(--rule); }
.slate thead th.l, .slate td.l { text-align: left; }
.slate thead abbr, .rtg thead abbr, .rec abbr { text-decoration: none; cursor: help; }
.slate tr.band th { text-align: left; background: var(--band); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; color: var(--ink); padding: 6px 10px; }
.slate tr.band th span { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: 8px; font-size: 13px; }
.slate tbody tr.g td { border-bottom: 1px solid var(--rule); }
.slate tbody tr.g:hover td { background: var(--accent-soft); }
.slate td.num { text-align: center; }
.slate td.adj { color: var(--muted); font-size: 13px; }
.slate td.kick { color: var(--muted); }
.slate td.at { color: var(--faint); font-size: 13px; text-align: center; padding-inline: 2px; }
.slate td.edge.hi { color: var(--accent-ink); font-weight: 700; }
.slate td.pick { font-weight: 500; }
.slate td.tv { color: var(--muted); }
.team { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.badge { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 18px; padding: 0 4px; border-radius: 4px; background: var(--tc); color: var(--tt); font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .04em; box-shadow: inset 0 0 0 1px var(--ring); }
.rk { color: var(--accent-ink); font-weight: 600; font-size: 12.5px; }
.score { margin-left: 4px; font-weight: 600; }
.dag { color: var(--accent-ink); font-weight: 700; margin-right: 3px; cursor: help; }
.res-W { color: var(--win); font-weight: 600; } .res-L { color: var(--loss); font-weight: 600; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars svg { width: 13px; height: 13px; display: block; }
.stars path.on { fill: var(--accent); } .stars path.off { fill: var(--star-off); }

/* game cards (narrow screens) */
.cards { display: none; }
.day { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.day:first-child { margin-top: 0; }
.day span { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; color: var(--muted); font-size: 13px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
.gcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px 11px; display: grid; gap: 7px; min-width: 0; }
.gcard.play { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.gcard .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; gap: 8px; }
.gcard .teams { display: grid; gap: 4px; }
.gcard .teams .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.gcard .teams .at { color: var(--faint); font-size: 12px; width: 16px; text-align: right; flex: none; }
.gcard .teams .row:first-child::before { content: ""; width: 16px; flex: none; }
.gcard .nm { min-width: 0; overflow-wrap: anywhere; }
.gcard .pickrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-top: 1px solid var(--rule); padding-top: 7px; }
.gcard .pickrow .p { font-weight: 600; font-size: 15px; }
.gcard .lbl { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-right: 4px; font-weight: 600; }
.gcard .e.hi { color: var(--accent-ink); font-weight: 700; }
.gcard .nums { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); }
.gcard .nums b { color: var(--ink); font-weight: 500; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
@media (max-width: 1079px) { .tablebox { display: none; } .cards { display: block; } }

/* notes */
.notes { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px 40px; padding-block: 18px 30px; border-top: 1px solid var(--rule); margin-top: 20px; }
.notes h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; margin: 0 0 6px; }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; }
.notes .nba { color: var(--ink); font-weight: 600; margin-top: 10px; font-size: 14px; }

/* ratings */
.rh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; margin-bottom: 12px; }
.rh h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; margin: 0; line-height: 1.05; }
.rh p { color: var(--muted); font-size: 13.5px; margin: 4px 0 0; max-width: 80ch; }
.rbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow-x: auto; max-width: 760px; }
table.rtg { border-collapse: collapse; width: 100%; font-size: 14px; }
.rtg th, .rtg td { padding: 5px 9px; white-space: nowrap; }
.rtg thead th { font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); text-align: right; background: var(--surface); }
.rtg thead th.l, .rtg td.l { text-align: left; }
.rtg tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--band) 45%, transparent); }
.rtg td { text-align: right; }
.rtg td.rank { font-weight: 700; color: var(--muted); width: 1%; }
.rtg td.cf { color: var(--muted); font-size: 13px; text-align: left; }
.rtg td.val { font-weight: 700; width: 1%; }
.rtg td.barc { width: 140px; padding-left: 4px; }
.pbar { display: block; position: relative; height: 10px; width: 132px; }
.pbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--faint); opacity: .6; }
.pbar i { position: absolute; top: 0; bottom: 0; }
.pbar i.pos { left: calc(50% + 1px); background: var(--accent); border-radius: 0 4px 4px 0; }
.pbar i.neg { right: calc(50% + 1px); background: var(--neg); border-radius: 4px 0 0 4px; }
.mv { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; }
.mv svg { width: 8px; height: 8px; }
.mv.up { color: var(--accent-ink); } .mv.up svg { fill: var(--accent-ink); }
.mv.dn { color: var(--muted); } .mv.dn svg { fill: var(--muted); }
.mv.eq { color: var(--faint); }
.mv.new { color: var(--accent-ink); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.rkbox { max-width: 1208px; }
.rkt td.nm { font-weight: 500; }
.rkt .hs { display: none; }
.rkt td.sub { color: var(--muted); }
.qnotes { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; max-width: 92ch; }
.xp { display: inline-block; vertical-align: middle; margin-left: 10px; font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.dnp { margin-left: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; cursor: help; }
@media (max-width: 560px) { .rtg td.barc, .rtg th.barc, .rtg td.cf, .rtg th.cf { display: none; } .rtg th, .rtg td { padding: 5px 6px; } .rtg td.l .team { white-space: normal; } }
@media (max-width: 1180px) { .rkt .wide { display: none; } }
@media (max-width: 760px) { .rkt td.barc, .rkt th.barc { display: none; } }
@media (max-width: 560px) { .rkt .mid { display: none; } .rkt td.nm { white-space: normal; } .rkt td.nm .badge { align-self: flex-start; margin-top: 1px; }
  .rkt th, .rkt td { padding: 5px 4px; } .rkt thead th { letter-spacing: .03em; } .rkt .hl { display: none; } .rkt .hs { display: inline; }
  .rkt td.nm .badge { min-width: 32px; } .rkt td.nm .team { gap: 5px; } }   /* Oct 27, 2026: room for the defenses' Yds/G on a phone (short headers: c.hs) */
@media (max-width: 1179px) { .mast .wrap { grid-template-columns: minmax(0, 1fr); align-items: start; } }
@media (max-width: 760px) {
  .mast .wrap { padding-block: 16px 14px; }
  .records { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; }
  .rec { flex: none; font-size: 13px; scroll-snap-align: start; }
  .rec th, .rec td { padding: 3px 8px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .seg { flex-wrap: nowrap; flex: none; }
  .search { flex: none; width: 150px; }
  .count { margin-left: 0; flex: none; }
  .notes { grid-template-columns: minmax(0, 1fr); }
  .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tab { font-size: 15px; padding: 5px 10px; }
}
@media (prefers-reduced-motion: no-preference) { .chip, .tab { transition: background-color .15s, color .15s, border-color .15s; } }
</style>

</head>
<body>
<header class="mast">
  <div class="wrap">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
      <ul class="gates" id="gates"></ul>
    </div>
    <div class="records" id="records" aria-label="Track record by star rating"></div>
  </div>
</header>

<nav class="bar" aria-label="Views and filters">
  <div class="wrap">
    <div class="tabs">
      <button class="tab" type="button" data-view="slate" id="tab-slate"></button>
      <span id="rk-tabs" style="display:contents"></span>
      <button class="tab" type="button" data-view="ratings" id="tab-ratings">Power Ratings</button>
    </div>
    <div class="filters" id="f-slate">
      <div class="seg" id="f-stars" role="group" aria-label="Minimum stars"></div>
      <div class="seg" id="f-day" role="group" aria-label="Day"></div>
      <input class="search" id="q" type="search" placeholder="Find a team" aria-label="Find a team" autocomplete="off">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="filters" id="f-rk" hidden>
      <select class="search" id="qconf" aria-label="Conference"></select>
      <input class="search" id="q3" type="search" placeholder="Find a player or team" aria-label="Find a player or team" autocomplete="off">
      <span class="count" id="count3" aria-live="polite"></span>
    </div>
    <div class="filters" id="f-ratings" hidden>
      <select class="search" id="conf" aria-label="Conference"></select>
      <input class="search" id="q2" type="search" placeholder="Find a team" aria-label="Find a team" autocomplete="off">
      <span class="count" id="count2" aria-live="polite"></span>
    </div>
  </div>
</nav>

<main class="wrap">
  <section id="view-slate">
    <p class="legend" id="legend"></p>
    <div class="tablebox"><table class="slate" id="slate"></table></div>
    <div class="cards" id="cards"></div>
  </section>
  <section id="view-rk" hidden>
    <div class="rh"><div><h2 id="q-title"></h2><p id="q-sub"></p></div></div>
    <div class="rbox rkbox"><table class="rtg rkt" id="qbt"></table></div>
    <ul class="qnotes" id="q-notes"></ul>
  </section>
  <section id="view-ratings" hidden>
    <div class="rh"><div><h2 id="r-title"></h2><p id="r-sub"></p></div></div>
    <div class="rbox"><table class="rtg" id="rtg"></table></div>
  </section>
  <section class="notes" aria-label="Notes and sources">
    <div><h2>Reading the card</h2><ul id="notes"></ul></div>
    <div><h2>Data</h2><ul id="credits"></ul><p class="nba">Not betting advice.</p></div>

<script>
(function () {
  const D = JSON.parse(document.getElementById('card-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (s) => (s === '--' ? '—' : esc(s).replace(/^-(?=\d)/, '−'));
  const SLOTS = D.star_slots || 3;
  const STAR = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
  const stars = (k, n) => '<span class="stars" role="img" aria-label="' + k + ' of ' + (n || SLOTS) + ' stars">' +
    Array.from({ length: n || SLOTS }, (_, i) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="' + (i < k ? 'on' : 'off') + '" d="' + STAR + '"/></svg>').join('') + '</span>';
  function ink(hex) {                                   // badge text: white on dark team colors, near-black on light ones
    const v = parseInt(hex.slice(1), 16), c = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map((x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 0.36 ? '#111111' : '#ffffff';
  }
  const badge = (t) => '<span class="badge" style="--tc:' + t.color + ';--tt:' + ink(t.color) + '">' + esc(t.abbr) + '</span>';
  const rank = (r) => (r ? '<span class="rk">#' + r + '</span>' : '');

  // ---- masthead
  const parts = String(D.title || '').split(': ');
  $('kicker').textContent = parts.length > 1 ? parts.slice(1).join(': ') : 'Air Raid Analytics';
  $('title').textContent = parts[0].replace(/^College Football\b/, 'CFB').replace(/\s*\(\d{4}\)\s*$/, '');   // Oct 27, 2026 (Joe): "CFB Week 9"
  const thru = D.ratings && D.ratings.thru;
  $('meta').innerHTML = 'Lines as of ' + esc(D.pulled || '') + (thru ? ' &middot; Ratings through Week ' + esc(thru) : '') + ' &middot; <b>Not betting advice</b>';
  if (D.gate_txt) {
    const g = D.gates || [];
    const items = g.map((lo, i) => '<li>' + stars(i + 1) + ' ' + (i + 1 < g.length ? lo + '–' + g[i + 1] : lo + '+') + ' pts</li>');
    const cap = (D.gate_txt.match(/\(([^)]*)\)\s*$/) || [])[1];
    $('gates').innerHTML = '<li>Model edge vs. the line:</li>' + items.join('') + (cap ? '<li>' + esc(cap.charAt(0).toUpperCase() + cap.slice(1)) + '</li>' : '');
  }
  // records: one panel per window, a column per market, rows from the top star down
  const wins = [];
  (D.records || []).forEach((r) => { let w = wins.find((x) => x.window === r.window); if (!w) { w = { window: r.window, m: [] }; wins.push(w); } w.m.push(r); });
  const cur = (w) => (String(w.window).startsWith(String(D.season)) ? 0 : 1);       // Oct 27, 2026 (Joe): this season's panel first
  wins.sort((a, b) => cur(a) - cur(b));
  $('records').innerHTML = wins.map((w) => {
    const mk = w.m.filter((r) => r.buckets);
    if (!mk.length) return '';
    const nb = mk[0].buckets.length, head = mk.map((r) => '<th scope="col">vs ' + esc(r.market === 'line' ? 'line' : r.market) + '</th>').join('');
    let body = '';
    for (let k = nb - 1; k >= 0; k--) {
      const lab = mk[0].buckets[k].label + (k === 0 && /^0/.test(mk[0].buckets[k].label) ? ' · no play' : '');
      body += '<tr><th scope="row">' + esc(lab) + '</th>' + mk.map((r) => { const b = r.buckets[k]; return '<td>' + b.w + '-' + b.l + (b.p ? '-' + b.p : '') + (b.pct != null ? '<span class="pct">' + b.pct.toFixed(1) + '%</span>' : '') + '</td>'; }).join('') + '</tr>';
    }
    const maeRow = mk.some((r) => r.mae) ? '<tr><th scope="row">MAE Model / Vegas</th>' + mk.map((r) => '<td>' + (r.mae ? r.mae.model.toFixed(2) + ' / ' + r.mae.line.toFixed(2) : '') + '</td>').join('') + '</tr>' : '';
    // Oct 27, 2026 (Joe): straight-up winners, the model's side vs. the line's favourite, on the same games (pick'ems left out)
    const suRow = mk.some((r) => r.su) ? '<tr><th scope="row"><abbr title="Straight up: how often the model’s side and the Vegas favorite won the game outright, on the same games (pick’em lines left out)">SU Model / Vegas</abbr></th>' +
      mk.map((r) => '<td>' + (r.su ? '<span title="' + r.su.n + ' games">' + r.su.model.toFixed(1) + '% / ' + r.su.line.toFixed(1) + '%</span>' : '') + '</td>').join('') + '</tr>' : '';
    const mae = maeRow || suRow ? '<tfoot>' + maeRow + suRow + '</tfoot>' : '';
    // Oct 27, 2026 (Joe): the window's name inside its card, top left ("2026 Weeks 1-8", "2023-2026 Weeks 1-15")
    const wl = String(w.window).replace(/\bweeks\b/, 'Weeks').replace(/^(\d{2})(\d{2})-(\d{2})\b/, (m, c, a, b) => c + a + '-' + c + b);
    return '<table class="rec"><caption class="sr">' + esc(wl) + '</caption><thead><tr><th class="win" scope="col">' + esc(wl) + '</th>' + head + '</tr></thead><tbody>' + body + '</tbody>' + mae + '</table>';
  }).join('');

  // ---- slate
  $('tab-slate').textContent = 'Week ' + (D.week || '') + ' Slate';
  const COLS = D.cols || [];
  const ADJ = { hfa: 1, alt: 1, inj: 1, wx: 1 };
  const TIP = { line: 'Current line, home team (negative = home favored)', open: 'Opening line, home team', model: 'Home Power Rating minus away, plus game terms',
    hfa: 'Home field plus the visitor’s travel', alt: 'Altitude', inj: 'Starting-QB injury adjustment', wx: 'Cold weather: the warmer-climate team gives ground',
    proj: 'Full projected home spread: MODEL + HFA + ALT + INJ + WX', edge: 'PROJ minus LINE (negative = the home side)' };
  $('legend').innerHTML = 'Every number is a <b>home-team spread</b>: negative means the home team is favored. ' +
    (D.build ? '<b>PROJ</b> = MODEL + HFA + ALT + INJ + WX; <b>EDGE</b> = PROJ − LINE. ' : '') + '<b>WIN%</b> is the home team’s chance to win outright.';
  const grpOf = (k) => (k === 'line' || k === 'open' ? 'v' : k === 'edge' ? 'e' : 'm');
  let grp = '<tr class="grp"><th colspan="4"></th>', run = null, n = 0;
  const GL = { v: 'Vegas', m: 'Air Raid model', e: 'Edge and pick' };
  COLS.forEach((c) => { const g = grpOf(c.key); if (g !== run) { if (run) grp += '<th class="g" colspan="' + (n + (run === 'e' ? 2 : 0)) + '">' + GL[run] + '</th>'; run = g; n = 0; } n++; });
  if (run) grp += '<th class="g" colspan="' + (n + (run === 'e' ? 2 : 0)) + '">' + GL[run] + '</th>';
  grp += '<th colspan="2"></th></tr>';
  const head = '<thead>' + grp + '<tr><th class="l" scope="col">Kick (ET)</th><th class="l" scope="col">Away</th><th scope="col"><span class="sr">Site</span></th><th class="l" scope="col">Home</th>' +
    COLS.map((c) => '<th scope="col"><abbr title="' + esc(TIP[c.key] || '') + '">' + esc(c.label) + '</abbr></th>').join('') +
    '<th class="l" scope="col">Pick</th><th scope="col"><abbr title="The home team’s chance to win outright">Win%</abbr></th><th class="l" scope="col">TV</th><th class="l" scope="col">Bet</th></tr></thead>';
  const NCOL = 4 + COLS.length + 4;
  const kick = (r) => esc(String(r.kick || '').toUpperCase());
  const teamCell = (t) => '<span class="team">' + badge(t) + rank(t.rank) + '<span>' + esc(t.team) + '</span>' + (t.score != null ? '<span class="score">' + t.score + '</span>' : '') + '</span>';
  const pickHTML = (r) => (r.key_flip ? '<span class="dag" title="Key-number pick: within a point of the line, the side with the better cover chance given how often 3s and 7s land">†</span>' : '') +
    (r.pick ? '<span class="' + (r.result ? 'res-' + esc(r.result) : '') + '">' + num(r.pick).replace(/ -(\d)/, ' −$1') + '</span>' : '—');
  function rowHTML(r) {
    return '<tr class="g"><td class="kick">' + kick(r) + '</td><td class="l">' + teamCell(r.away) + '</td><td class="at">' + (r.neutral ? 'vs' : '@') + '</td><td class="l">' + teamCell(r.home) + '</td>' +
      COLS.map((c) => '<td class="num' + (ADJ[c.key] ? ' adj' : '') + (c.key === 'edge' ? ' edge' + (r.edge_hi ? ' hi' : '') : '') + '">' + num(r[c.key]) + '</td>').join('') +
      '<td class="pick l">' + pickHTML(r) + '</td><td class="num">' + esc(r.win) + '</td><td class="tv l">' + (esc(r.tv) || '—') + '</td><td class="l">' + stars(r.stars) + '</td></tr>';
  }
  function cardHTML(r) {
    const hab = r.home.abbr;
    const strip = COLS.filter((c) => c.key !== 'edge' && r[c.key] !== '' && r[c.key] != null).map((c) => '<span><span class="lbl">' + esc(c.label) + '</span><b class="grid-n">' + num(r[c.key]) + '</b></span>').join('');
    return '<article class="gcard' + (r.stars > 0 ? ' play' : '') + '"><div class="top"><span>' + kick(r) + (r.tv ? ' · ' + esc(r.tv) : '') + '</span>' + stars(r.stars) + '</div>' +
      '<div class="teams"><div class="row">' + teamCell(r.away) + '</div><div class="row"><span class="at">' + (r.neutral ? 'vs' : '@') + '</span>' + teamCell(r.home) + '</div></div>' +
      '<div class="pickrow"><span><span class="lbl">Pick</span><span class="p">' + pickHTML(r) + '</span></span>' +
      '<span><span class="lbl">Edge</span><span class="e grid-n' + (r.edge_hi ? ' hi' : '') + '">' + num(r.edge) + '</span></span>' +
      (r.win ? '<span><span class="lbl">' + esc(hab) + ' win</span><span class="grid-n">' + esc(r.win) + '</span></span>' : '') + '</div>' +
      '<div class="nums">' + strip + '</div></article>';
  }
  const S = { min: 0, day: 'all', q: '' };
  const days = [];
  (D.rows || []).forEach((r) => { if (!days.includes(r.date)) days.push(r.date); });
  const plays = (k) => (D.rows || []).filter((r) => r.stars >= k).length;
  $('f-stars').innerHTML = [0, 1, 2, 3].filter((k) => k <= SLOTS).map((k) => '<button class="chip" type="button" data-min="' + k + '" aria-pressed="' + (k === 0) + '">' +
    (k === 0 ? 'All games' : stars(k, k) + (k < SLOTS ? '+' : '')) + ' <span class="n">' + plays(k) + '</span></button>').join('');
  $('f-day').innerHTML = ['all'].concat(days).map((d) => '<button class="chip" type="button" data-day="' + esc(d) + '" aria-pressed="' + (d === 'all') + '">' + (d === 'all' ? 'All days' : esc(d.split(' ')[0])) + '</button>').join('');
  const hit = (t, q) => t.team.toLowerCase().includes(q) || String(t.abbr).toLowerCase() === q;
  function renderSlate() {
    const q = S.q.trim().toLowerCase();
    const rows = (D.rows || []).filter((r) => r.stars >= S.min && (S.day === 'all' || r.date === S.day) && (!q || hit(r.away, q) || hit(r.home, q)));
    const groups = [];
    rows.forEach((r) => { let g = groups.find((x) => x.date === r.date); if (!g) { g = { date: r.date, rows: [] }; groups.push(g); } g.rows.push(r); });
    const cnt = (k) => k + (k === 1 ? ' game' : ' games');
    $('slate').innerHTML = head + (groups.length ? groups.map((g) => '<tbody><tr class="band"><th colspan="' + NCOL + '" scope="colgroup">' + esc(String(g.date).toUpperCase()) + '<span>' + cnt(g.rows.length) + '</span></th></tr>' + g.rows.map(rowHTML).join('') + '</tbody>').join('')
      : '<tbody><tr><td colspan="' + NCOL + '" class="empty">No games match these filters.</td></tr></tbody>');
    $('cards').innerHTML = groups.length ? groups.map((g) => '<h3 class="day">' + esc(String(g.date).toUpperCase()) + '<span>' + cnt(g.rows.length) + '</span></h3><div class="cgrid">' + g.rows.map(cardHTML).join('') + '</div>').join('')
      : '<p class="empty">No games match these filters.</p>';
    const p = rows.filter((r) => r.stars > 0).length;
    $('count').textContent = cnt(rows.length) + ' · ' + p + (p === 1 ? ' play' : ' plays');
  }
  $('f-stars').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.min = +b.dataset.min; $('f-stars').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderSlate(); });
  $('f-day').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.day = b.dataset.day; $('f-day').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderSlate(); });
  $('q').addEventListener('input', (e) => { S.q = e.target.value; renderSlate(); });

  // ---- notes and data credits
  $('notes').innerHTML = (D.notes || []).concat(D.footer || []).map((t) => '<li>' + esc(t) + '</li>').join('');
  $('credits').innerHTML = (D.credits || []).map((t) => '<li>' + esc(t) + '</li>').join('');

  const TRI = { up: 'M5 1L9 8H1z', dn: 'M5 9L1 2h8z' };
  const mv = (m) => m == null ? '' : m === 0 ? '<span class="mv eq" aria-label="no change">–</span>'
    : '<span class="mv ' + (m > 0 ? 'up' : 'dn') + '" aria-label="' + (m > 0 ? 'up ' : 'down ') + Math.abs(m) + '"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="' + (m > 0 ? TRI.up : TRI.dn) + '"/></svg>' + Math.abs(m) + '</span>';
  const confOptions = (rows) => {
    const cs = [];
    rows.forEach((r) => { if (r.conf && !cs.some((c) => c.k === r.conf)) cs.push({ k: r.conf, n: r.conf_full || r.conf }); });
    cs.sort((a, b) => a.n.localeCompare(b.n));
    return '<option value="">All FBS</option>' + cs.map((c) => '<option value="' + esc(c.k) + '">' + esc(c.n) + '</option>').join('');
  };

  // ---- ranking tabs (QB, RB, WR, TE, O-line, run D, pass D): one renderer, the columns come with the data
  const RK = D.rk;
  const RKO = RK ? RK.order : [];
  const sgn = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const FMT = { e3: (v) => sgn(v, 3), z2: (v) => sgn(v, 2), f1: (v) => v.toFixed(1), f2: (v) => v.toFixed(2), p1: (v) => (100 * v).toFixed(1) + '%', i: (v) => String(v) };
  const cellOf = (c, r) => c.f === 'tdint' ? r.td + '-' + r.int : (r[c.k] == null ? '—' : FMT[c.f](r[c.k]));
  $('rk-tabs').innerHTML = RKO.map((g) => '<button class="tab" type="button" data-view="' + g + '" id="tab-' + g + '">' + esc(RK.tabs[g].label) + '</button>').join('');
  const SR = { g: RKO[0], q: '' };
  // Oct 27, 2026 (Joe, 7:51 AM: "The conference filter is broken when switching between power ratings and one of the positions"):
  // one conference choice for every table view -- the power ratings' select and the ranking tabs' select show and set the same value
  const FILT = { conf: '' };
  const ALLROWS = [];
  RKO.forEach((g) => RK.tabs[g].rows.forEach((r) => ALLROWS.push(r)));
  ((D.ratings || {}).rows || []).forEach((r) => ALLROWS.push(r));
  const CONF_OPTS = confOptions(ALLROWS);
  function setConf(c) {
    FILT.conf = c;
    ['conf', 'qconf'].forEach((id) => { const el = $(id); if (el && el.value !== c) el.value = c; });
  }
  $('qconf').innerHTML = CONF_OPTS;
  let renderRatings = null;
  function renderRK() {
    const T = RK.tabs[SR.g];
    const B = T.bar || { k: 'rating', mode: 'zero' };
    const bv = (r) => (B.mode === 'lower' ? B.ref - r[B.k] : B.mode === 'higher' ? r[B.k] - B.ref : r[B.k]);
    const step = Math.max.apply(null, T.rows.map((r) => Math.abs(bv(r))).concat([0])) > 1 ? 0.5 : 0.05;
    const M = Math.max(step * 2, Math.ceil(Math.max.apply(null, T.rows.map((r) => Math.abs(bv(r))).concat([0])) / step) * step);
    const bar = (v) => { const w = Math.min(50, (Math.abs(v) / M) * 50); return '<span class="pbar" aria-hidden="true"><i class="' + (v >= 0 ? 'pos' : 'neg') + '" style="width:calc(' + w.toFixed(2) + '% - 1px)"></i></span>'; };
    $('q-title').innerHTML = esc(T.title) + (T.experimental ? '<span class="xp" title="New on Oct 27, 2026; the method may change">Experimental</span>' : '');
    $('q-sub').textContent = T.subtitle || '';
    $('q-notes').innerHTML = (T.notes || []).map((t) => '<li>' + esc(t) + '</li>').join('');
    const team = T.who === 'Team';
    const head = '<thead><tr><th scope="col">#</th><th class="l" scope="col">' + esc(T.who) + '</th>' +
      T.cols.map((c, i) => '<th class="' + (c.c === 'val' ? '' : c.c) + '" scope="col"><abbr title="' + esc(c.t || '') + '">' + (c.hs ? '<span class="hl">' + esc(c.h) + '</span><span class="hs">' + esc(c.hs) + '</span>' : esc(c.h)) + '</abbr></th>' +
        (i === 0 ? '<th class="barc" scope="col"><span class="sr">Bar</span></th>' : '')).join('') +
      '<th scope="col"><abbr title="Rank change from last week">Move</abbr></th></tr></thead>';
    const q = SR.q.trim().toLowerCase();
    const rows = T.rows.filter((r) => (!FILT.conf || r.conf === FILT.conf) && (!q || (r.name || '').toLowerCase().includes(q) || r.team.toLowerCase().includes(q) || String(r.abbr).toLowerCase() === q));
    const who = (r) => team ? '<span class="team">' + badge(r) + '<span>' + esc(r.team) + '</span></span>'
      : '<span class="team" title="' + esc(r.team) + '">' + badge(r) + '<span>' + esc(r.name) + (r.dnp ? '<span class="dnp" title="Did not play in his team’s last game">DNP</span>' : '') + '</span></span>';
    $('qbt').innerHTML = head + '<tbody>' + (rows.length ? rows.map((r) => '<tr><td class="rank">' + r.rank + '</td><td class="l nm">' + who(r) + '</td>' +
      T.cols.map((c, i) => '<td class="' + (c.c || '') + '">' + cellOf(c, r).replace(/^-/, '−') + '</td>' + (i === 0 ? '<td class="barc">' + bar(bv(r)) + '</td>' : '')).join('') +
      '<td>' + (r.new ? '<span class="mv new">new</span>' : mv(r.move)) + '</td></tr>').join('')
      : '<tr><td colspan="' + (T.cols.length + 4) + '" class="empty">No ' + (team ? 'teams' : 'players') + ' match.</td></tr>') + '</tbody>';
    $('count3').textContent = rows.length + (team ? (rows.length === 1 ? ' team' : ' teams') : (rows.length === 1 ? ' player' : ' players'));
  }
  $('qconf').addEventListener('change', (e) => { setConf(e.target.value); renderRK(); });
  $('q3').addEventListener('input', (e) => { SR.q = e.target.value; renderRK(); });

  // ---- power ratings
  const R = D.ratings;
  if (!R) { $('tab-ratings').hidden = true; }
  else {
    $('r-title').textContent = R.title || 'Power Ratings';
    $('r-sub').textContent = R.subtitle || '';
    $('conf').innerHTML = CONF_OPTS;
    const M = Math.max(5, Math.ceil(Math.max.apply(null, R.rows.map((r) => Math.abs(r.rating_raw || 0))) / 5) * 5);   // one scale for every bar
    const bar = (v) => { const w = Math.min(50, (Math.abs(v) / M) * 50); return '<span class="pbar" aria-hidden="true"><i class="' + (v >= 0 ? 'pos' : 'neg') + '" style="width:calc(' + w.toFixed(2) + '% - 1px)"></i></span>'; };
    const rhead = '<thead><tr><th scope="col">#</th><th class="l" scope="col">Team</th><th scope="col">Rec</th><th class="l cf" scope="col">Conf</th><th scope="col">Rating</th><th class="barc" scope="col"><span class="sr">Rating bar</span></th><th scope="col">Move</th></tr></thead>';
    const S2 = { q: '' };
    renderRatings = function () {
      const q = S2.q.trim().toLowerCase();
      const rows = R.rows.filter((r) => (!FILT.conf || r.conf === FILT.conf) && (!q || r.team.toLowerCase().includes(q) || String(r.abbr).toLowerCase() === q));
      $('rtg').innerHTML = rhead + '<tbody>' + (rows.length ? rows.map((r) => '<tr><td class="rank">' + r.rank + '</td><td class="l"><span class="team">' + badge(r) + rank(r.ap) + '<span>' + esc(r.team) + '</span></span></td><td>' + esc(r.rec) +
        '</td><td class="cf">' + esc(r.conf) + '</td><td class="val">' + num(r.rating) + '</td><td class="barc">' + bar(r.rating_raw || 0) + '</td><td>' + mv(r.move) + '</td></tr>').join('')
        : '<tr><td colspan="7" class="empty">No teams match.</td></tr>') + '</tbody>';
      $('count2').textContent = rows.length + (rows.length === 1 ? ' team' : ' teams');
    };
    $('conf').addEventListener('change', (e) => { setConf(e.target.value); renderRatings(); });
    $('q2').addEventListener('input', (e) => { S2.q = e.target.value; renderRatings(); });
    renderRatings();
  }

  // ---- views: the slate, the ranking tabs, the power ratings.  Buttons, not links: some hosts swallow anchor clicks, so the
  // view is script state; the hash is kept in step for deep links where the host allows it (Oct 27, 2026: Joe could not click the tabs).
  let VIEW = location.hash.slice(1);
  function show(h) {
    VIEW = h;
    try { if (location.hash.slice(1) !== h && history.replaceState) history.replaceState(null, '', '#' + h); } catch (e) { /* a sandboxed host */ }
    route();
  }
  function route() {
    const h = VIEW;
    const v = h === 'ratings' && R ? 'ratings' : RKO.includes(h) ? 'rk' : 'slate';
    if (v === 'rk' && SR.g !== h) { SR.g = h; }
    setConf(FILT.conf);                                            // both selects show the shared choice
    if (v === 'rk') renderRK();
    if (v === 'ratings' && renderRatings) renderRatings();
    $('view-slate').hidden = v !== 'slate'; $('f-slate').hidden = v !== 'slate';
    $('view-rk').hidden = v !== 'rk'; $('f-rk').hidden = v !== 'rk';
    $('view-ratings').hidden = v !== 'ratings'; $('f-ratings').hidden = v !== 'ratings';
    $('tab-slate').setAttribute('aria-current', v === 'slate' ? 'page' : 'false');
    RKO.forEach((g) => $('tab-' + g).setAttribute('aria-current', v === 'rk' && SR.g === g ? 'page' : 'false'));
    $('tab-ratings').setAttribute('aria-current', v === 'ratings' ? 'page' : 'false');
    const cur = document.querySelector('.tab[aria-current="page"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    cue();
  }
  const TB = document.querySelector('.tablebox');
  function cue() { TB.classList.toggle('more', TB.scrollWidth > TB.clientWidth + 2 && TB.scrollLeft + TB.clientWidth < TB.scrollWidth - 2); }
  TB.addEventListener('scroll', cue);
  window.addEventListener('resize', cue);
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; e.preventDefault(); show(b.dataset.view); });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== VIEW) { VIEW = h; route(); } });
  renderSlate(); route();
})();
</script>

</body>
</html>
