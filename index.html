<style>
/* Nov 3, 2026 (audit 22 card C3): when the web fonts do not load (a blocked fonts.googleapis.com, or the moment before they arrive) the
   page fell back to Arial-width text: the filters dropped below the tab row, the phone tab row scrolled and the records carousel cut off
   its last column.  These fallbacks are Arial / Helvetica scaled to the Barlow widths (Barlow Condensed 600-700 about 73-74% of Arial Bold,
   Barlow Semi Condensed 400-600 about 83% of Arial, measured on the page's own strings), with Barlow's line metrics. */
@font-face { font-family: "ARA Display Fallback"; font-weight: 100 500; src: local("Arial"), local("ArialMT"), local("Helvetica"), local("Liberation Sans"), local("LiberationSans"); size-adjust: 76%; ascent-override: 131%; descent-override: 26%; line-gap-override: 0%; }
@font-face { font-family: "ARA Display Fallback"; font-weight: 600 900; src: local("Arial Bold"), local("Arial-BoldMT"), local("Helvetica Bold"), local("Helvetica-Bold"), local("Liberation Sans Bold"), local("LiberationSans-Bold"); size-adjust: 72%; ascent-override: 139%; descent-override: 28%; line-gap-override: 0%; }
@font-face { font-family: "ARA Body Fallback"; font-weight: 100 500; src: local("Arial"), local("ArialMT"), local("Helvetica"), local("Liberation Sans"), local("LiberationSans"); size-adjust: 83%; ascent-override: 120%; descent-override: 24%; line-gap-override: 0%; }
@font-face { font-family: "ARA Body Fallback"; font-weight: 600 900; src: local("Arial Bold"), local("Arial-BoldMT"), local("Helvetica Bold"), local("Helvetica-Bold"), local("Liberation Sans Bold"), local("LiberationSans-Bold"); size-adjust: 81%; ascent-override: 123%; descent-override: 25%; line-gap-override: 0%; }
/* Layout: a broadcast slate board. Masthead with the track record, a sticky tab-and-filter bar, day-banded games
   (the card's full table on wide screens, stacked game cards on narrow ones), and a ranked ratings board with a power bar. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --band: #e8ecf1; --ink: #121821; --muted: #566171; --faint: #66707e;
  --rule: #dbe0e6; --accent: #1f6feb; --accent-ink: #1456c4; --accent-soft: #e4edfc; --star-off: #cfd6df;
  --neg: #c4562c; --win: #1a7f37; --loss: #c62828; --ring: rgba(18, 24, 33, 0);
  --font-display: "Barlow Condensed", "ARA Display Fallback", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow Semi Condensed", "ARA Body Fallback", "Roboto Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f15; --surface: #121821; --band: #1a212b; --ink: #e5e9ef; --muted: #9ca6b4; --faint: #8a94a3;
    --rule: #26303b; --accent: #4c8dff; --accent-ink: #84b0ff; --accent-soft: #15233a; --star-off: #323c48;
    --neg: #e3824f; --win: #3fb950; --loss: #f47067; --ring: rgba(255, 255, 255, .16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f15; --surface: #121821; --band: #1a212b; --ink: #e5e9ef; --muted: #9ca6b4; --faint: #8a94a3;
  --rule: #26303b; --accent: #4c8dff; --accent-ink: #84b0ff; --accent-soft: #15233a; --star-off: #323c48;
  --neg: #e3824f; --win: #3fb950; --loss: #f47067; --ring: rgba(255, 255, 255, .16); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, .rec td, .rtg td, .grid-n { font-variant-numeric: tabular-nums; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
html { -webkit-tap-highlight-color: transparent; }   /* Oct 30, 2026, 8:51 PM (Joe: "take away the blue action that happens when you click a box") */
select.search:focus, select.search:focus-visible, .gcard .info:focus, .gcard .info:focus-visible, .search:focus, .search:focus-visible { outline: none; }

/* masthead */
.mast { background: var(--surface); border-bottom: 1px solid var(--rule); }
.mast .wrap { padding-block: 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 40px; align-items: start; }   /* Oct 30, 2026 (Joe, 11:37 AM): the left block's top on the records' top (was end) */
.kicker { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.2vw, 46px); line-height: .98; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
.meta b { color: var(--ink); font-weight: 600; }
.gates { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); }
.gates li { display: inline-flex; align-items: center; gap: 6px; }
.records { display: flex; gap: 14px; flex-wrap: wrap; }
.rec { border-collapse: collapse; font-size: 13.5px; background: var(--bg); border-radius: 8px; overflow: hidden; position: relative; }   /* relative: the hidden caption stays inside its card (phones scroll the cards sideways) */
.rec caption { caption-side: top; text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px; }
.rec thead th.win { text-align: left; text-transform: none; letter-spacing: .01em; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink); white-space: normal; }
.rec th, .rec td { padding: 4px 10px; text-align: right; white-space: nowrap; }
.rec thead th { font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--rule); }
.rec tbody th { text-align: left; font-weight: 500; color: var(--muted); }
.rec tbody tr:first-child td { color: var(--ink); font-weight: 600; }
.rec .pct { color: var(--muted); margin-left: 6px; }
.rec tfoot td, .rec tfoot th { border-top: 1px solid var(--rule); color: var(--muted); font-weight: 400; }
.rec tfoot th { text-align: left; }
.rec-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rec-dots { display: none; }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-start; padding-block: 10px; }   /* Nov 2, 2026 (Joe, 8:05 PM): the filters level with the main tab row, not centred on main + sub-tabs (.filters' min-height) */
.tabs { display: inline-flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; background: var(--band); border-radius: 9px; padding: 3px; gap: 2px; }   /* audit 19 card L5 */
.tab { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 7px; white-space: nowrap; background: transparent; border: 0; cursor: pointer; appearance: none; line-height: 1.4; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
/* Nov 2, 2026 (Joe, 6:41 PM: "Lets also get sub tabs going"): the main tabs, and under Slate and Position Ratings a row of sub-tabs */
.tabnav { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 100%; min-width: 0; }
.tabs.sub { background: none; padding: 0 3px; gap: 4px; }
.tabs.sub .tab { font-size: 15px; padding: 3px 12px; border-radius: 999px; }
.tabs.sub .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
#egg { -webkit-tap-highlight-color: transparent; }
.egg-f { display: flex; gap: 8px; max-width: 320px; margin-top: 12px; }
.egg-f input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.egg-f button { font: inherit; font-size: 16px; font-weight: 600; padding: 7px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
.egg-m { font-size: 14px; color: var(--muted); min-height: 1.3em; margin: 5px 0 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: 1 1 auto; min-width: 0; min-height: calc(6px + 16px * 1.4 + 10px); }   /* the main tab row's height: .tabs' padding + one .tab */
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: var(--bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: var(--bg); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.chip[aria-pressed="true"] .stars path.on { fill: #fff; }
.chip[aria-pressed="true"] .stars path.off { fill: rgba(255, 255, 255, .35); }
.chip .n { color: var(--faint); font-size: 13px; }
.chip[aria-pressed="true"] .n { color: rgba(255, 255, 255, .8); }
.search { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 5px 10px; width: 170px; max-width: 100%; }
select.search { width: auto; }
.count { color: var(--muted); font-size: 13.5px; margin-left: auto; }

/* slate */
main { padding-block: 16px 8px; }
.legend { color: var(--muted); font-size: 13.5px; margin: 12px 0 0; max-width: 80ch; }   /* Oct 30, 2026 (Joe, 11:37 AM): in the masthead, under the gates */
.legend b { color: var(--ink); font-weight: 600; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; scrollbar-width: thin; }
.tablebox.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
table.slate { border-collapse: collapse; width: 100%; font-size: 14px; }
.slate th, .slate td { padding: 5px 5px; white-space: nowrap; }
.slate thead th { font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: center; border-bottom: 1px solid var(--rule); background: var(--surface); }
.slate thead tr.grp th { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; color: var(--faint); border-bottom: 0; padding-bottom: 2px; }
/* Oct 30, 2026 (Joe, 12:23 PM: "the line below vegas, air raid model, and edge and pick is transparent. when you scroll, you see the text
   behind it. lets make it the same color as the aforementioned text"): the line under the group labels is drawn by the labels' own cells
   (::after; it was th.g's 2px --rule table border), 2px in the labels' color (--faint), on a band of the header's color that reaches 3px
   into the column-name row.  A collapsed table border is painted by the table where the header sits unmoved, so the locked (moved) header
   lost the line, and its two rows met at a fractional pixel the rows behind showed through; the band is opaque across that seam.
   The 2px padding takes the place of the border (same header height, the line where it was). */
.slate thead tr.grp th::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 5px; background: var(--surface); }
.slate thead tr.grp th.g::after { background: linear-gradient(var(--faint) 2px, var(--surface) 2px); }
.slate thead th.l, .slate td.l { text-align: left; }
.slate thead abbr, .rtg thead abbr, .rec abbr { text-decoration: none; cursor: help; }
.slate tr.band th { text-align: left; background: var(--band); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; color: var(--ink); padding: 6px 10px; }
.slate tr.band th span { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: 8px; font-size: 13px; }
.slate tbody tr.g td { border-bottom: 1px solid var(--rule); }
.slate tbody tr.g:hover td { background: var(--accent-soft); }
.slate td.num { text-align: center; }
.slate td.adj { color: var(--muted); font-size: 13px; }
.slate td.kick { color: var(--muted); }
.slate td.at { color: var(--faint); font-size: 13px; text-align: center; padding-inline: 2px; }
.slate td.edge.hi { color: var(--accent-ink); font-weight: 700; }
.slate td.pick { font-weight: 500; }
.slate td.tv { color: var(--muted); }
.team { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.badge { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 18px; padding: 0 4px; border-radius: 4px; background: var(--tc); color: var(--tt); font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .04em; box-shadow: inset 0 0 0 1px var(--ring); }
.rk { color: var(--accent-ink); font-weight: 600; font-size: 12.5px; }
.score { margin-left: 4px; font-weight: 600; }
.dag { color: var(--accent-ink); font-weight: 700; margin-right: 3px; cursor: help; }
.res-W { color: var(--win); font-weight: 600; } .res-L { color: var(--loss); font-weight: 600; } .res-P { color: var(--muted); font-weight: 600; }
/* Oct 30, 2026 (Joe, 7:30 PM: live scores): the game clock in the kick column / card top, a dot while the game is on; the pick green
   while it covers the card's line, red while it does not (the final result in the res-* colors) */
.lv { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.lv::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--loss); }
.lv.fin { color: var(--muted); } .lv.fin::before { display: none; }
.lv-up { color: var(--win); font-weight: 600; } .lv-dn { color: var(--loss); font-weight: 600; } .lv-eq { color: var(--muted); font-weight: 600; }
/* Oct 30, 2026, 7:44 PM (Joe): a football beside the team with the ball; down, distance and field position under the clock (red inside the 20) */
.ball { flex: none; width: 14px; height: 9px; display: block; }
.dd { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; margin-top: 1px; }
.dd.rz { color: var(--loss); font-weight: 600; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars svg { width: 13px; height: 13px; display: block; }
.stars path.on { fill: var(--accent); } .stars path.off { fill: var(--star-off); }

/* game cards (narrow screens) */
.cards { display: none; }
.day { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.day:first-child { margin-top: 0; }
.day span { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; color: var(--muted); font-size: 13px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 5px 10px; }   /* Oct 30, 2026, 9:18 PM (Joe): half the space between cards (was 10 px) */
.gcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px 11px; display: grid; gap: 7px; min-width: 0; }
.gcard { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }   /* Oct 30, 2026, 9:35 PM (Joe): the blue border on every card (was the plays only) */
.gcard .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; gap: 8px; }
.gcard .teams { display: grid; gap: 4px; }
.gcard .teams .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.gcard .teams .at { color: var(--faint); font-size: 12px; width: 16px; text-align: right; flex: none; }
.gcard .teams .row:first-child::before { content: ""; width: 16px; flex: none; }
.gcard .nm { min-width: 0; overflow-wrap: anywhere; }
.gcard .lbl { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-right: 4px; font-weight: 600; }
/* Oct 30, 2026, 7:59 PM (Joe: "I like B"): the pick beside the stars, one strip of numbers, the (i) and its popover */
.gcard { position: relative; }
.gcard .top .tl { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 14px; min-width: 0; }   /* Oct 30, 8:17 PM: spaced, no dots, centred */
.gcard .top .tl > span { white-space: nowrap; display: inline-flex; align-items: center; }
.gcard .top .lv { line-height: 1; }
.gcard .top .ddi { color: var(--ink); font-weight: 500; } .gcard .top .ddi.rz { color: var(--loss); font-weight: 600; }
.gcard .strip b.pk { font-weight: 700; padding: 0 4px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-ink); }
@media (max-width: 379px) { .gcard .strip b.pk { padding: 0 4px; } }
/* Oct 30, 2026, 8:17 PM (Joe: "move the score to the right; maybe not all the way. vertically align the scores"): a score column */
.gcard .teams .row { display: grid; grid-template-columns: 16px minmax(0, 1fr) 3.2em 22%; align-items: center; gap: 0 7px; }
.gcard .teams .sc { text-align: right; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.gcard .strip b.pk.lv-up, .gcard .strip b.pk.res-W { color: var(--win); background: color-mix(in srgb, var(--win) 14%, transparent); }
.gcard .strip b.pk.lv-dn, .gcard .strip b.pk.res-L { color: var(--loss); background: color-mix(in srgb, var(--loss) 14%, transparent); }
.gcard .strip b.pk.lv-eq, .gcard .strip b.pk.res-P { color: var(--muted); background: var(--band); }
.gcard .strip { display: flex; justify-content: space-between; column-gap: 4px; align-items: center; border-top: 1px solid var(--rule); padding-top: 7px; font-size: var(--sfs, 12.5px); min-width: 0; }
.gcard .strip .ci { white-space: nowrap; display: inline-flex; align-items: baseline; gap: 2px; }
.gcard .strip .ci:empty { display: none; }   /* 9:08 PM: equal space between the items on each card (a missing item leaves no hole) */
.gcard .strip .info { margin-left: 0; }
.gcard .strip .lbl { margin-right: 0; font-size: calc(var(--sfs, 12.5px) * .8); letter-spacing: .02em; }
.gcard .strip b { color: var(--ink); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gcard .strip b.hi { color: var(--accent-ink); font-weight: 700; }
.gcard .info { margin-left: auto; align-self: center; flex: none; display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; padding: 0; border-radius: 50%;
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent-ink); font: italic 700 12px/1 Georgia, "Times New Roman", serif; cursor: pointer; }
.gcard .info[aria-expanded="true"] { background: var(--accent); color: var(--surface); }
.gcard .pop { position: absolute; right: 8px; bottom: 42px; z-index: 5; width: min(270px, calc(100% - 16px)); background: var(--ink); color: var(--surface); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.gcard .pop .g { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; }
.gcard .pop .g span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.gcard .pop .tot { border-top: 1px solid color-mix(in srgb, var(--surface) 30%, transparent); margin-top: 4px; padding-top: 4px; font-weight: 700; }
.gcard .pop .note { opacity: .75; font-size: 11px; margin-top: 5px; line-height: 1.3; }
.gcard .pop::after { content: ''; position: absolute; right: 12px; bottom: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
.gcard .pop.down { bottom: auto; top: calc(100% - 4px); }
.gcard .pop.down::after { bottom: auto; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
/* Oct 30, 2026, 8:39 PM (Joe: "a tad more compressed vertically"): tighter card padding and row gaps, same fonts and horizontal spacing */
.gcard { padding-block: 6px; gap: 3px; }   /* 8:51 PM: about 5% shorter again */
.gcard .teams { gap: 1px; }
.gcard .strip { padding-top: 5px; }
/* the slate's three dropdowns share the filter row on a phone (the count, which the stars dropdown already shows, steps aside) */
/* Oct 30, 2026, 8:51 PM (Joe): the games filter 25% narrower (sized to its text), the day filter wide enough to show "Saturday night (13)" */
/* 8:57 PM (Joe: "The teams filter needs to be wider to fit the longest name. Steal space from the days filter"): on a phone the games and team
   filters are as wide as their longest option, the day filter takes what is left (its labels lost their counts) */
@media (max-width: 760px) { #f-slate { gap: 6px; } #f-slate select.search { font-size: var(--ffs, 13px); padding-inline: 6px 0; width: auto; } #f-slate #f-stars, #f-slate #f-team { flex: 0 0 auto; }
  #f-slate #f-day { flex: 1 1 0; min-width: 0; } #f-slate .count { display: none; } }
@media (max-width: 370px) { #f-slate { gap: 5px; } #f-slate select.search { padding-inline: 5px 0; } }   /* the smallest phones: tighter (fitFilters sets the type) */
/* Nov 3, 2026 (Joe, 6:14 AM: "Do now: ... 10"): on a phone the position and power-ratings filters keep their count in view ("190 players" was
   cut off past the row's edge): the conference dropdown at its own width, the search box takes what is left, the count at its own width */
@media (max-width: 760px) { #f-rk, #f-ratings { gap: 8px; } #f-rk select.search, #f-ratings select.search { flex: 0 0 auto; width: auto; }

/* ratings */
.rh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; margin-bottom: 12px; }
.rh h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; margin: 0; line-height: 1.05; }

.rbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow-x: auto; max-width: 760px; }
table.rtg { border-collapse: collapse; width: 100%; font-size: 14px; }
.rtg th, .rtg td { padding: 5px 9px; white-space: nowrap; }
.rtg thead th { font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); text-align: right; background: var(--surface); }
.rtg thead th.l, .rtg td.l { text-align: left; }

.pbar { display: block; position: relative; height: 10px; width: 132px; }

.pbar i { position: absolute; top: 0; bottom: 0; }
.pbar i.pos { left: calc(50% + 1px); background: var(--accent); border-radius: 0 4px 4px 0; }

.mv { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; }

.mv.dn { color: var(--muted); } .mv.dn svg { fill: var(--muted); }

.rkbox { max-width: 1208px; }
.rkt td.nm { font-weight: 500; }
.rkt .hs { display: none; }
.rkt td.sub { color: var(--muted); }
.qnotes { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; max-width: 92ch; }
/* Oct 30, 2026 (Joe, 11:37 AM): the slate's, the ranking tabs' and the power ratings' header rows stay under the tab bar while the page scrolls.
   The tables sit in sideways-scrolling boxes (overflow-x), which position: sticky cannot reach past, so the script sets --hy (how far the
   table's top has gone under the bar) and the header cells move down by it, inside their own table (they still scroll sideways with it). */
.slate thead th, .rtg thead th { position: relative; z-index: 2; transform: translateY(var(--hy, 0px)); }
.hy thead tr:last-child th { box-shadow: inset 0 -1px 0 var(--rule), 0 3px 4px -3px rgba(0, 0, 0, .25); }
/* Oct 30, 2026 (Joe, 12:23 PM): no rows showing through the locked header's top and bottom edges either (a hairline on a 2x screen at
   each): the header's bottom rule is drawn inside its cells (the 1px collapsed table border stayed where the table is painted, and the
   moved cells did not cover their half of it; the extra 1px of padding holds the rule, so the rows below keep their places), and while
   locked each top cell carries a cap of its own color 3px up under the bar, over the fraction of a pixel the moved cells can leave there. */
.slate thead tr:last-child th, .rtg thead th { border-bottom: 0; padding-bottom: 6px; box-shadow: inset 0 -1px 0 var(--rule); }
.hy thead tr:first-child th::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 6px; background: var(--surface); }
/* Oct 30, 2026 (Joe, 12:23 PM: "it also stops in the middle of a line whenever there is a scroll. lets ensure a scroll stops at the top of
   a record"; 12:24 PM: on every tab): the page snaps to invisible markers the script keeps in #snaps (after main, outside the sideways-
   scrolling boxes, which would otherwise be the rows' snap container), each placed where the page must rest for a record's top to sit at
   the locked header's bottom, plus a stop at the page's top and one at its bottom (i.end).  On only while a record is passing under the
   locked header (the script sets html.snap-rows), so the masthead and the notes scroll freely; proximity, not mandatory: records are
   ~30 px apart, so a scroll that ends in a table always lands on one, while a fling from the table can still carry past its end. */
html.snap-rows { scroll-snap-type: y proximity; }
.snaps { position: relative; height: 0; }
.snaps i { position: absolute; left: 0; width: 1px; height: 1px; scroll-snap-align: start; pointer-events: none; }
.snaps i.end { top: -1px; scroll-snap-align: end; }
.cards { transform: translateY(var(--cy, 0px)); }   /* at rest, under half a pixel: the card at the bar's bottom meets it exactly (script) */
.dnp { margin-left: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; cursor: help; }
@media (max-width: 560px) { .rtg td.barc, .rtg th.barc, .rtg td.cf, .rtg th.cf { display: none; } .rtg th, .rtg td { padding: 5px 6px; } .rtg td.l .team { white-space: normal; } }
@media (max-width: 1180px) { .rkt .wide { display: none; } }
@media (max-width: 760px) { .rkt td.barc, .rkt th.barc { display: none; } }
@media (max-width: 560px) { .rkt .mid { display: none; } .rkt td.nm { white-space: normal; } .rkt td.nm .badge { align-self: flex-start; margin-top: 1px; }
  .rkt th, .rkt td { padding: 5px 4px; } .rkt thead th { letter-spacing: .03em; } .rkt .hl { display: none; } .rkt .hs { display: inline; }
  .rkt td.nm .badge { min-width: 32px; } .rkt td.nm .team { gap: 5px; } }   /* Oct 27, 2026: room for the defenses' Yds/G on a phone (short headers: c.hs) */
@media (max-width: 1179px) { .mast .wrap { grid-template-columns: minmax(0, 1fr); align-items: start; } }
@media (max-width: 760px) {
  .mast .wrap { padding-block: 16px 14px; }
  /* Nov 2, 2026 (Joe, 7:21 PM: "On mobile, lets have a carousel for the results boxes, so the right one isnt hidden"): one panel per
     screen width, swiped or picked by the dots under them */
  .records { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 12px; padding-bottom: 2px; }
  .records::-webkit-scrollbar { display: none; }
  .rec { flex: 0 0 100%; width: 100%; font-size: 13px; scroll-snap-align: start; scroll-snap-stop: always; }

  .rec-dots:not(:empty) { display: flex; justify-content: center; gap: 2px; margin-top: -4px; }
  .rec-dots button { width: 28px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  .rec-dots button::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--star-off); transition: width .15s, background-color .15s; }
  .rec-dots button[aria-current="true"]::before { width: 20px; background: var(--accent); }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-height: 0; }

  .seg { flex-wrap: nowrap; flex: none; }
  .search { flex: none; width: 150px; }

  .notes { grid-template-columns: minmax(0, 1fr); }
  .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }

  #tabs-main .tab { font-size: 14px; padding: 5px 8px; letter-spacing: 0; }   /* Nov 2, 2026: "Week 10 Slate" ... "Matchup Lab" in one row on a phone */
}
@media (max-width: 389px) { #tabs-main .tab { font-size: 13px; padding: 5px 6px; } }
@media (max-width: 340px) { .rec { font-size: 12px; } .rec th, .rec td { padding: 3px 5px; } }
@media (prefers-reduced-motion: no-preference) { .chip, .tab { transition: background-color .15s, color .15s, border-color .15s; } }
/* Oct 31, 2026 (Joe, 7:42 PM): the Matchup tab -- any two FBS teams and a site: the projected spread and win probability from the power
   ratings, the four units side by side (bar = percentile among FBS teams), and who has the edge when each team has the ball */
.mx { display: grid; gap: 12px; max-width: 1120px; }
.mxc { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; min-width: 0; }

.mx-pick .pa { grid-area: a; } .mx-pick .pb { grid-area: b; } .mx-pick .ps { grid-area: s; }
.mx-pick select { font: inherit; font-size: 16px; width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.mx-site { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: var(--band); border-radius: 9px; padding: 3px; }
.mx-site button { font-family: var(--font-display); font-weight: 600; font-size: 15px; height: 34px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mx-site button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.mx-head { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px 20px; align-items: center; }
.mx-tm { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mx-tm.b { flex-direction: row-reverse; text-align: right; }

.mx-tm .sub { display: block; color: var(--muted); font-size: 14px; }
.mx .bg { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 40px; padding: 0 8px; border-radius: 8px; background: var(--tc); color: var(--tt);
  font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; box-shadow: inset 0 0 0 1px var(--ring); }
.mx-sp { text-align: center; }
.mx-sp .v { display: block; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; }

.mx-win { margin-top: 16px; }

.mx-win .lb .mx-lab { margin: 0; }
.mx-win .wb { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--band); }
.mx-win .wb i { display: block; height: 100%; background: var(--tc); box-shadow: inset 0 0 0 1px var(--ring); }
.mxc h3 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0; line-height: 1.1; }
.mx-tt { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.mx-tt p { margin: 0; color: var(--muted); font-size: 13px; }
.tu { display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1fr); grid-template-areas: "a l b"; gap: 4px 16px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
.tu .tl { grid-area: l; text-align: center; } .tu .ts.a { grid-area: a; } .tu .ts.b { grid-area: b; }
.tu .tl b { display: block; font-weight: 600; } .tu .tl span { display: block; color: var(--muted); font-size: 12px; }
.ts { display: grid; grid-template-columns: 44px 58px minmax(0, 1fr); gap: 10px; align-items: center; }
.ts.b { grid-template-columns: minmax(0, 1fr) 58px 44px; }
.ts .tk { display: none; font-weight: 600; font-size: 14px; color: var(--muted); }

.ts.b .tb { order: 1; } .ts.b .tv { order: 2; text-align: right; } .ts.b .tr { order: 3; }

@media (max-width: 760px) {

<body>
<header class="mast">

    </div>
    <!-- /tabs -->
    <div class="filters" id="f-slate">
      <select class="search" id="f-stars" aria-label="Stars"></select>
      <select class="search" id="f-day" aria-label="Day and kickoff window"></select>
      <select class="search" id="f-team" aria-label="Team"></select>

      <div class="mxc mx-pick">
        <div class="pa"><label class="mx-lab" for="mx-a">Team A</label><select id="mx-a"></select></div>

          <button type="button" data-s="a" id="mx-sa"></button><button type="button" data-s="n">Neutral</button><button type="button" data-s="b" id="mx-sb"></button></div></div>

  </section>

erage run add to it, worse ones take away. The total is multiplied by 0.65: on ten past seasons a quarterback's points a game over the rest of the season ran about 0.65 times this measure, so the rating is a forecast of the points a game he adds from here on. Pass, Run and Sched are on the same scale. The average quarterback run is +0.160 EPA against +0.037 for all runs, so a quarterback who runs often gains even at an average quarterback's efficiency.","Pass and Run are the two halves. Eff/db is his passing efficiency per dropback, not scaled, in EPA: his opponent-adjusted EPA per dropback plus 2.82 x his success rate above an average passer's (the average dropback is +0.071 EPA). Success rate repeats from week to week more reliably than EPA, which a few long plays can swing, so the blend predicts a quarterback's rest of season better than EPA alone (tested on ten past seasons). Value grows with how many plays a quarterback gets. Only this season's plays count. Small samples are pulled toward the average for his tier (Power 4 -- the SEC, Big Ten, Big 12, ACC and Notre Dame -- or Group of 5): for EPA, its average passer on the passing side and this season's average quarterback run, plus his tier's rushing level, on the running side; for success rate, its average. The Power 4 and Group of 5 levels are measured from this season's games between them, and a conference moves off its tier's level only as far as its own games support, so stats piled up against weaker defenses are not taken at face value.","A quarterback with 40-49 attempts is still mostly the average. Minimum: 40 pass attempts this season. A game counts when he had 10 or more plays outside garbage time. Only the plays of the games that count enter the rating. DNP: did not play in his team’s last game; he stays ranked."],"rows":[{"key":"USC|j.maiava","team":"USC","rating":9.6271,"pv":9.5017,"rv":0.1254,"epa":0.5456,"raw":11.9708,"sched":2.3646,"gp":9,"db":301,"runs":13,"att":297,"cmp":199,"yds":2536,"td":20     if (nq && nq.addEventListener) nq.addEventListener('change', ph); ph(); }
  $('tabnav').addEventListener('click', (e) => { const l = e.target.closest('a.tab'); if (l && l.getAttribute('href')) l.href = fresh(l.getAttribute('href')); }, true);   // Nov 3 (9): before the browser follows it
  $('tabnav').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b || b.tagName === 'A') return; e.preventDefault(); show(b.dataset.view); });

  // ---- the hidden Private tab (Nov 2, 2026; Joe, 6:41 PM: "hide the alternate slate until I click somewhere, like an easter egg? If I
  // click on CFB, it prompts a password input? ... once I visit the page and enter the password, I dont have to enter it again unless I
  // leave or close out or timeout"): no visible tab; a click on "CFB" in the title opens a password box.  The password is tested against
  // the password page itself (alternate/: its salt, rounds and ciphertext, decrypted here and thrown away), and what is kept is the key
  // derived from it -- never the password -- in this browser tab's sessionStorage, until 30 minutes pass without a click, key or scroll
  // (it also survives leaving the site and coming back in the same tab, and a reopened tab or restored session; audit 22 G6).  The
  // password page opens straight from it.  The storage name and the 30 minutes are the
  // password page's too.  On the alternate page itself (no #tab-alt) the title stays plain.
  const AK = 'ara.alt', AT = 30 * 60 * 1000, ALT = $('tab-alt');
  const aGet = () => {
    try { const v = JSON.parse(sessionStorage.getItem(AK) || 'null'); if (v && v.e > Date.now()) return v; if (v) sessionStorage.removeItem(AK); } catch (e) { /* storage off */ }
    return null;
  };
  // Nov 4, 2026 (Joe, 9:02 AM: "Lets wire that to the site in a Team Analyzer tab. Password protected with our typical password logic";
  // 11:30 AM: "Lets not pop the team analyzer out into a separate full page. Keep it underneath the tab structure like the rest of them"):
  // the Team Analyzer is a view of this page, shown with Version 2 once unlocked.  Its content is not on this page: team/ holds it encrypted
  // with the same key, and the tab decrypts it with the kept key (never the password) into a shadow root under the tab bar, so its styles
  // and this page's stay apart.  When the key lapses the view is emptied and the tab hidden again.
  const TEAMT = $('tab-team'), TASRC = 'team/';
  var taOn = false, taBusy = null;
  function taHex(s) { const n = s.length >> 1, u = new Uint8Array(n); for (let i = 0; i < n; i++) u[i] = parseInt(s.substr(2 * i, 2), 16); return u; }
  function taUnmount() {
    if (!taOn && !taBusy) return;
    taOn = false; const h = $('ta-host'), n = document.createElement('div'); n.id = 'ta-host'; h.replaceWith(n);
    $('ta-sub').textContent = ''; try { delete window.__ta; delete window.__TA_ROOT; } catch (e) { /* old browser */ }
  }
  function taMount() {
    if (taOn) { if (window.__ta && window.__ta.setHash) window.__ta.setHash(); return; }
    if (taBusy) return;
    const v = aGet(), M = $('ta-msg');
    if (!v) return;
    M.hidden = false; M.textContent = 'Opening the Team Analyzer…';
    taBusy = (async () => {
      const r = await fetch(fresh(TASRC), { cache: 'no-store' });
      const m = r.ok && (await r.text()).match(/const D = (\{[^;]*\});/);
      const P = m && JSON.parse(m[1]);
      if (!P || !P.ct) throw new Error('unreachable');
      if (P.salt !== v.s) throw new Error('key');
      const key = await crypto.subtle.importKey('raw', taHex(v.k), 'AES-GCM', false, ['decrypt']);
      const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: taHex(P.iv) }, key, taHex(P.ct));
      const html = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      if (!aGet()) throw new Error('key');
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const host = $('ta-host'), root = host.shadowRoot || host.attachShadow({ mode: 'open' });
      root.innerHTML = doc.getElementById('ta-body').innerHTML;
      const d = document.createElement('script'); d.type = 'application/json'; d.id = 'ta-data'; d.textContent = doc.getElementById('ta-data').textContent; root.appendChild(d);
      window.__TA_ROOT = root;
      const sc = document.createElement('script'); sc.textContent = doc.getElementById('ta-js').textContent; document.body.appendChild(sc); sc.remove();
      taOn = true;
    })();
    taBusy.then(() => { M.hidden = true; if (VIEW !== 'team' && !VIEW.startsWith('team=')) return; if (window.__ta && window.__ta.setHash) window.__ta.setHash(); },
      (e) => { M.textContent = e && e.message === 'unreachable' ? 'Could not reach the Team Analyzer; try again.' : 'The Team Analyzer needs the password again: click CFB in the title.'; })
      .finally(() => { taBusy = null; });
  }
  const aState = () => {
    const on = !!aGet(); if (ALT) { ALT.hidden = !on; slateSub(); }
    if (TEAMT) { TEAMT.hidden = !on; if (!on) { taUnmount(); if (CURV === 'team') show('slate'); } }
  };
  let aT = 0;
  const aTouch = () => {
    const now = Date.now(); if (now - aT < 15000) return; aT = now;
    const v = aGet(); if (v) { v.e = now + AT; try { sessionStorage.setItem(AK, JSON.stringify(v)); } catch (e) { /* storage off */ } }
    aState();
  };
  ['pointerdown', 'keydown', 'scroll'].forEach((t) => window.addEventListener(t, aTouch, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { aT = 0; aTouch(); } });
  setInterval(aState, 60000);
  aState();
  if (ALT && /^CFB\b/.test($('title').textContent)) {
    const hx = (s) => new Uint8Array(s.match(/../g).map((x) => parseInt(x, 16)));
    const xh = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('');
    const unlock = async (pw) => {
      let P;
      try {
        const r = await fetch(ALT.href, { cache: 'no-store' });
        const m = r.ok && (await r.text()).match(/const D = (\{[^;]*\});/);
        P = m && JSON.parse(m[1]);
      } catch (e) { P = null; }
      if (!P || !P.salt || !P.ct) throw new Error('unreachable');
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: hx(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256);
      const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: hx(P.iv) }, key, hx(P.ct));   // a wrong password fails here
      return { k: xh(bits), s: P.salt, e: Date.now() + AT };
    };
    const t = $('title').textContent;
    $('title').innerHTML = '<span id="egg">CFB</span>' + esc(t.slice(3));
    let F = null;
    const close = () => { if (F) { F.remove(); F = null; } };
    $('egg').addEventListener('click', () => {
      if (aGet()) { location.href = fresh(ALT.getAttribute('href')); return; }
      if (F) { close(); return; }
      F = document.createElement('div');
      F.innerHTML = '<form class="egg-f"><input type="password" autocomplete="current-password" aria-label="Password" placeholder="Password">' +
        '<button type="submit">Open</button></form><p class="egg-m" role="status"></p>';
      $('title').after(F);
      const I = F.querySelector('input'), M = F.querySelector('.egg-m');
      I.focus();
      I.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      F.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!window.crypto || !crypto.subtle) { M.textContent = 'This browser cannot open it.'; return; }
        M.textContent = 'Checking…';
        let v;
        try { v = await unlock(I.value); } catch (err) { M.textContent = err && err.message === 'unreachable' ? 'Could not reach it; try again.' : 'Wrong password.'; I.select(); return; }
        try { sessionStorage.setItem(AK, JSON.stringify(v)); } catch (err) { /* storage off: the password page asks again */ }
        M.textContent = 'Opening…';
        aState();
        location.href = fresh(ALT.getAttribute('href'));
      });
    });
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== VIEW) { VIEW = h; route(); } });
  renderSlate(); route();
})();
</script>
